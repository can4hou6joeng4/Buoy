name: AnyRouter 自动签到
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anyrouter-checkin-production
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    environment: production
    env:
      PYTHONIOENCODING: utf-8
      # 仓库可见性，用于隐私控制
      REPO_VISIBILITY: ${{ github.event.repository.visibility }}
      # 时区设置（可选，默认为 Asia/Shanghai 中国时区）
      TZ: ${{ secrets.TZ }}
      # 时间戳格式（可选，默认为 %Y-%m-%d %H:%M:%S）
      TIMESTAMP_FORMAT: ${{ secrets.TIMESTAMP_FORMAT }}
      # 账号配置
      ANYROUTER_ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
      # 是否显示敏感信息
      SHOW_SENSITIVE_INFO: ${{ secrets.SHOW_SENSITIVE_INFO }}
      # 仅显示真实账号名称，不公开余额等其他敏感信息
      SHOW_ACCOUNT_NAMES: ${{ vars.SHOW_ACCOUNT_NAMES || 'false' }}
      # 通知配置
      DINGTALK_NOTIF_CONFIG: ${{ secrets.DINGTALK_NOTIF_CONFIG }}
      EMAIL_NOTIF_CONFIG: ${{ secrets.EMAIL_NOTIF_CONFIG }}
      PUSHPLUS_NOTIF_CONFIG: ${{ secrets.PUSHPLUS_NOTIF_CONFIG }}
      SERVERPUSH_NOTIF_CONFIG: ${{ secrets.SERVERPUSH_NOTIF_CONFIG }}
      FEISHU_NOTIF_CONFIG: ${{ secrets.FEISHU_NOTIF_CONFIG }}
      WECOM_NOTIF_CONFIG: ${{ secrets.WECOM_NOTIF_CONFIG }}
      TELEGRAM_NOTIF_CONFIG: ${{ secrets.TELEGRAM_NOTIF_CONFIG }}
      # table 显式选择内置 Rich Markdown 表格，覆盖旧 Secret 的模板/格式，保留凭据及通知选项
      TELEGRAM_LAYOUT: ${{ vars.TELEGRAM_LAYOUT }}
      # 通知触发条件（默认在失败、任意账号余额变化、新增账号首次建立基线时通知，可通过仓库变量 NOTIFY_TRIGGERS 覆盖）
      NOTIFY_TRIGGERS: ${{ vars.NOTIFY_TRIGGERS || 'failed,balance_changed,first_seen' }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v6

      - name: 🔧 安装 Mise
        uses: jdx/mise-action@v4
        with:
          cache_key: "{{default}}-${{ hashFiles('pyproject.toml') }}"

      - name: ⚙️ 安装依赖
        run: mise run install

      - name: 🎭 配置 Playwright 环境
        uses: ./.github/actions/setup-playwright
        id: playwright-setup

      - name: 💾 恢复余额历史缓存
        uses: actions/cache@v5
        with:
          path: balance_hash.txt
          key: balance-hash-${{ github.run_id }}
          restore-keys: |
            balance-hash-

      - name: 🚀 执行签到任务
        id: checkin
        continue-on-error: true
        env:
          # 凭据刷新或账号名称更新时生成，供后续步骤安全写回 Environment Secret
          ANYROUTER_REFRESHED_ACCOUNTS_FILE: ${{ runner.temp }}/anyrouter-refreshed-accounts.json
        run: mise run checkin

      - name: 🔄 持久化自动刷新的账号凭据
        if: always()
        env:
          GH_TOKEN: ${{ secrets.BUOY_SECRET_SYNC_TOKEN }}
          REFRESHED_ACCOUNTS_FILE: ${{ runner.temp }}/anyrouter-refreshed-accounts.json
        run: |
          if [[ ! -s "$REFRESHED_ACCOUNTS_FILE" ]]; then
            echo "本次没有更新账号配置，无需更新 GitHub Environment Secret"
            exit 0
          fi

          # 无论写回成功、失败或后续命令异常退出，都清空临时凭据。
          trap ': > "$REFRESHED_ACCOUNTS_FILE"' EXIT
          refreshed_accounts=$(<"$REFRESHED_ACCOUNTS_FILE")
          echo "::add-mask::$refreshed_accounts"

          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::账号配置已更新但未持久化：缺少 BUOY_SECRET_SYNC_TOKEN，无法更新 production 环境的 ANYROUTER_ACCOUNTS"
            exit 1
          fi

          if ! printf '%s' "$refreshed_accounts" | gh secret set ANYROUTER_ACCOUNTS \
            --env production \
            --repo "$GITHUB_REPOSITORY"; then
            echo "::error::账号配置已更新但未持久化：GitHub Environment Secret 写回失败，请查看上方 gh 原始错误"
            echo "若公钥 API 返回 HTTP 403，请检查 BUOY_SECRET_SYNC_TOKEN 的 Fine-grained PAT：目标仓库是否正确、Environments 是否为 Read and write，以及有效期和审批/访问限制。普通 Secrets 权限或修改 workflow permissions 不能替代该授权；其他错误请按原始错误排查。"

            # 使用本次工作流的同步 Token 做只读诊断，仅输出白名单响应头。
            # 不输出响应体、账号数据或 Token；诊断失败不改变写回失败状态。
            shopt -s nocasematch
            for endpoint in "user" "repos/$GITHUB_REPOSITORY" "repos/$GITHUB_REPOSITORY/environments/production/secrets/public-key"; do
              echo "同步 Token 权限诊断：GET $endpoint"
              response=$(gh api --include --method GET "$endpoint" </dev/null 2>/dev/null) || :
              while IFS= read -r header; do
                [[ -z "$header" || "$header" == $'\r' ]] && break
                case "$header" in
                  http/*|x-accepted-github-permissions:*|x-oauth-scopes:*|github-authentication-token-expiration:*)
                    printf '%s\n' "$header"
                    ;;
                esac
              done <<< "$response"
            done
            exit 1
          fi

          echo "已更新 production 环境的 ANYROUTER_ACCOUNTS，后续定时签到将使用新凭据"

      - name: ❌ 传播签到失败状态
        if: always() && steps.checkin.outcome == 'failure'
        run: |
          echo "::error::AnyRouter 签到任务失败"
          exit 1
